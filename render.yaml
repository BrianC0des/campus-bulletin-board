services:
  - type: web
    name: campus-bulletin-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

      - key: CAMPUS_TIMEZONE
        value: Asia/Manila
      - key: CLIENT_URL
        value: https://campus-bulletin-board.vercel.app
